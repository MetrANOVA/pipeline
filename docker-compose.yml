version: '3.8'

services:

  cache-ip-trie:
    image: metranova/pipeline:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - conf/envs/base.env
      - conf/envs/cache_ip_trie.env
    volumes:
      - ./conf:/app/conf:ro
      - ./pipelines:/app/pipelines:ro
    expose:
      - "8080"
    restart: always

  pipeline:
    image: metranova/pipeline:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - conf/envs/base.env
      - ${PIPELINE_ENV_FILE:-.env}
    volumes:
      - ./conf:/app/conf:ro
      - ./pipelines:/app/pipelines:ro
    depends_on:
      - cache-ip-trie
    restart: always
    deploy:
      mode: replicated
      replicas: ${PIPELINE_REPLICAS:-1}

  redis:
    image: redis:8.2.1
    ports:
      - "6379:6379"